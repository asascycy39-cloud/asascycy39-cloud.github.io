<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#02040a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%231b3456'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='4.5' fill='none' stroke='%2383b9ff' stroke-width='1.2' transform='rotate(-22 16 16)'/%3E%3C/svg%3E" />
    <meta name="description" content="EARTH LIVE — 可自由旋转的实时地球：真实昼夜、云层、台风风暴、实时航班与摄像头手势控制。" />
    <title>EARTH LIVE · 实时地球</title>
    <script type="module" crossorigin src="/assets/index-Cejs_E4U.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BGJ6WDiC.css">
  </head>
  <body>
    <canvas id="scene" aria-label="可旋转的三维地球"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div id="info-card" class="info-card" hidden></div>

    <header class="hud hud-top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
          <circle cx="22" cy="22" r="9.5" />
          <ellipse cx="22" cy="22" rx="19" ry="6.4" transform="rotate(-22 22 22)" />
          <circle class="brand-dot" cx="39.5" cy="14.5" r="1.8" />
        </svg>
        <div class="brand-copy">
          <h1>EARTH <span>LIVE</span></h1>
          <p>实时地球观测 · 昼夜 / 云层 / 航迹 / 风暴</p>
        </div>
      </div>

      <div class="readout">
        <div class="readout-row">
          <span class="label">UTC</span>
          <strong id="clock-utc">--:--:--</strong>
        </div>
        <div class="readout-row">
          <span class="label" id="local-label">LOCAL</span>
          <strong id="clock-local">--:--:--</strong>
        </div>
        <div class="readout-meta" id="subsolar">太阳直射点 · 计算中</div>
      </div>
    </header>

    <div class="layer-controls" id="layer-controls">
      <span class="control-label">航线密度</span>
      <div class="segmented" id="density-control" role="group" aria-label="航线密度">
        <button type="button" data-density="low">低</button>
        <button type="button" data-density="medium" class="active">中</button>
        <button type="button" data-density="high">高</button>
      </div>
      <span class="flight-count" id="flight-count">载入航班…</span>
      <button type="button" id="gesture-toggle" class="gesture-toggle" title="打开摄像头手势控制">手势</button>
    </div>

    <div id="gesture-panel" class="gesture-panel" hidden data-state="idle">
      <div class="gesture-top">
        <span class="gesture-dot" aria-hidden="true"></span>
        <span id="gesture-label">等待手势</span>
        <button type="button" id="gesture-close" aria-label="关闭手势控制">×</button>
      </div>
      <video id="gesture-video" class="gesture-video" playsinline muted aria-label="手势摄像头预览"></video>
      <div class="gesture-help">张开手掌拖动地球 · 捏合后上下移动缩放 · 握拳暂停</div>
    </div>

    <footer class="hud hud-bottom">
      <div class="hint">
        <span class="pulse" aria-hidden="true"></span>
        拖动旋转 <i>·</i> 滚轮缩放 <i>·</i> 悬停查看 <i>·</i> 手势控制
      </div>
      <div class="phase">PHASE 04 <span>·</span> CAMERA GESTURES</div>
    </footer>

    <div id="loader" role="status" aria-live="polite">
      <div class="loader-inner">
        <div class="loader-orbit" aria-hidden="true"><span></span></div>
        <div class="loader-title">EARTH LIVE</div>
        <div class="loader-sub">正在接入真实地球纹理</div>
        <div class="loader-track"><div class="loader-fill" id="loader-fill"></div></div>
        <div class="loader-pct" id="loader-pct">0%</div>
      </div>
    </div>

  </body>
</html>
